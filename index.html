<!DOCTYPE html><html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTS Pemrograman Lanjut</title>
    <link rel="stylesheet" href="style.css">
</head><body>
    <header>
        <h1>My App UTS</h1>
    </header>

    <main>
        <div class="kalkulator">
            <h2>Operasi Matematika dengan JavaScript</h2>
            
            <div class="form-group">
                <label for="angka1">Angka Pertama</label>
                <input type="number" id="angka1" placeholder="Masukkan angka">
            </div>
            
            <div class="form-group">
                <label for="angka2">Angka Kedua</label>
                <input type="number" id="angka2" placeholder="Masukkan angka">
            </div>
            
            <div class="form-group">
                <label for="operasi">Operasi</label>
                <select id="operasi">
                    <option value="tambah">Penjumlahan (+)</option>
                    <option value="kurang">Pengurangan (-)</option>
                    <option value="kali">Perkalian (x)</option>
                    <option value="bagi">Pembagian (/)</option>
                </select>
            </div>
            
            <button onclick="hitung()">Hitung</button>
            <div id="hasilBox"></div>
        </div>
    </main>

    <footer>
        &copy; 2026 UTS Pemrograman Lanjut - Darmajaya
    </footer>
    <script src="script.js"></script>
</body></html>
